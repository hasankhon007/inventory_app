name: Build and deploy ASP.NET Core apps to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: src/Course.WebApp/Course.WebApp.csproj
      PUBLISH_PATH: ./published-webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.PUBLISH_PATH }}

  deploy-webapp:
    runs-on: ubuntu-latest
    needs: build-webapp
    permissions: {}
    env:
      PUBLISH_PATH: ./published-webapp
    environment:
      name: production-webapp
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: webapp
          path: ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}

  build-webapi:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: src/Course.WebAPI/Course.WebAPI.csproj
      PUBLISH_PATH: ./published-webapi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi
          path: ${{ env.PUBLISH_PATH }}

  deploy-webapi:
    runs-on: ubuntu-latest
    needs: build-webapi
    permissions: {}
    env:
      PUBLISH_PATH: ./published-webapi
    environment:
      name: production-webapi
      url: ${{ steps.deploy-to-webapi.outputs.webapp-url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: webapi
          path: ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapi
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPI_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPI_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
